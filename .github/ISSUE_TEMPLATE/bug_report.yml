name: Bug report
description: Something in HangTodo doesn't work as it should.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open HangTodo with Option+T
        2. ...
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: macOS 27.0.1
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: HangTodo version
      description: The release you installed, or the commit if you built it from source.
      placeholder: "0.1.0"
  - type: dropdown
    id: language
    attributes:
      label: Interface language
      options:
        - "中文"
        - "English"
  - type: textarea
    id: more
    attributes:
      label: Anything else
      description: A screenshot or a short recording helps a lot.
