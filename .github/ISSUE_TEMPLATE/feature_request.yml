name: Idea
description: Something you'd like HangTodo to do.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: HangTodo keeps tasks accessible on a single clothesline. Describe the task-management problem your idea would solve.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The situation where HangTodo falls short today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: How you imagine it working.
